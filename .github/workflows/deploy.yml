name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy-hint:
    name: Deployment gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deployment notes
        run: |
          echo "POSLanka main branch updated."
          echo "Configure production deploy with repository secrets:"
          echo "  RAILWAY_TOKEN, RAILWAY_SERVICE"
          echo "App root: retail-smart-erp-main"

  railway:
    name: Railway deploy
    runs-on: ubuntu-latest
    needs: [deploy-hint]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Skip when token missing
        id: check
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          if [ -z "$RAILWAY_TOKEN" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "RAILWAY_TOKEN not set — skipping deploy"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install Railway CLI
        if: steps.check.outputs.skip == 'false'
        run: npm install -g @railway/cli

      - name: Deploy
        if: steps.check.outputs.skip == 'false'
        working-directory: retail-smart-erp-main
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_SERVICE: ${{ secrets.RAILWAY_SERVICE }}
        run: |
          SERVICE="${RAILWAY_SERVICE:-poslanka}"
          railway up --service "$SERVICE" --ci
