name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

defaults:
  run:
    working-directory: retail-smart-erp-main

jobs:
  lint-and-validate:
    name: Lint & migration validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: retail-smart-erp-main/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: ESLint (POSLanka paths + core src)
        run: npx eslint "src/lib/features/**/*.{ts,tsx}" "src/lib/whatsapp/**/*.{ts,tsx}" "src/lib/pdf/**/*.{ts,tsx}" "src/lib/offline/**/*.{ts,tsx}" "src/lib/i18n/**/*.{ts,tsx}" "src/lib/webxpay/**/*.{ts,tsx}" "src/hooks/useI18n.ts" "src/hooks/useOfflinePos.ts" "src/hooks/useFeatureFlag.ts" "src/app/api/features/**/*.{ts,tsx}" "src/app/api/quotations/**/*.{ts,tsx}" "src/app/api/credit-notes/**/*.{ts,tsx}" "src/app/api/documents/**/*.{ts,tsx}" "src/app/api/webxpay/**/*.{ts,tsx}" "src/app/api/auth/mobile-login/**/*.{ts,tsx}" "src/app/api/auth/impersonate/**/*.{ts,tsx}" "src/app/api/sys-control/vendors/**/*.{ts,tsx}" "src/components/shared/**/*.{ts,tsx}" "src/components/pos/OfflineStatusBanner.tsx" "src/components/pos/POSPaymentModal.tsx" --max-warnings 50

      - name: Validate migration numbers
        run: npm run validate:migrations

  typecheck:
    name: TypeScript
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: retail-smart-erp-main/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        env:
          NODE_OPTIONS: --max-old-space-size=6144
        run: npx tsc --noEmit

  build:
    name: Production build
    runs-on: ubuntu-latest
    needs: [lint-and-validate, typecheck]
    env:
      SKIP_MIGRATIONS: 'true'
      NEXTAUTH_SECRET: ci-build-secret-not-for-production
      NEXTAUTH_URL: http://localhost:3000
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/poslanka
      NEXT_PUBLIC_APP_NAME: POSLanka
      NEXT_PUBLIC_BASE_DOMAIN: localhost
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: retail-smart-erp-main/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

  mobile-lint:
    name: Mobile app package check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: retail-smart-erp-main/apps/mobile
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Validate package.json
        run: node -e "JSON.parse(require('fs').readFileSync('package.json','utf8')); console.log('mobile package.json OK')"
