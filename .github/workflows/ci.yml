name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

defaults:
  run:
    working-directory: retail-smart-erp-main

# tsc / eslint / next build on this codebase need more than Node's default heap
env:
  NODE_OPTIONS: --max-old-space-size=6144

jobs:
  lint-and-validate:
    name: Lint & migration validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: retail-smart-erp-main/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: ESLint (whole project, zero warnings)
        run: npx eslint . --max-warnings 0

      - name: Validate migration numbers
        run: npm run validate:migrations

  typecheck:
    name: TypeScript
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: retail-smart-erp-main/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

  db-tests:
    name: Database & business-logic tests
    runs-on: ubuntu-latest
    needs: [typecheck]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: poslanka_ci
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/poslanka_ci
      DATABASE_APP_ROLE: app_user
      NEXTAUTH_SECRET: ci-test-secret-not-for-production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: retail-smart-erp-main/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Migrate a fresh database
        run: npm run db:migrate

      - name: Migrations are idempotent (second run is a no-op)
        run: npm run db:migrate | tee /dev/stderr | grep -q "up to date"

      - name: Tenant isolation check
        run: npm run db:check-isolation

      - name: Schema drift (every table/column the code uses exists)
        run: npm run db:check-drift

      - name: Pure self-tests (printing, labels, barcodes)
        run: |
          npx tsx src/lib/print/escpos/__selftest__.ts
          npx tsx scripts/tests/w9-labels.ts
          npx tsx scripts/tests/pos-keyboard.ts
          npx tsx scripts/tests/ws-print-layout.ts
          npx tsx scripts/tests/w7-logo-raster.ts
          npx tsx scripts/tests/w7-code128.ts
          npx tsx scripts/tests/w7-mobile-receipt.ts
          npx tsx scripts/tests/l7-print-agent-install.ts
          npx tsx scripts/tests/l8-driver-image.ts
          npx tsx scripts/tests/l10-printer-setup-script.ts
          npx tsx scripts/tests/l12-receipt-pdf.ts
          npx tsx scripts/tests/l13-split-tenders.ts
          npx tsx scripts/tests/l16-mobile-pay.ts

      - name: Staff accounts
        run: npx tsx scripts/tests/w1-staff.ts
      - name: Inventory core (item codes, ledger, stock takes, invoice numbers)
        run: npx tsx scripts/tests/w2-inventory.ts
      - name: Stock intake & sync
        run: npx tsx scripts/tests/w3-intake.ts
      - name: Import / export
        run: npx tsx scripts/tests/w4-import.ts
      - name: Returns, exchange, purchasing
        run: npx tsx --tsconfig scripts/tests/w8-harness/tsconfig.json scripts/tests/w8-returns.ts
      - name: Tenant isolation behaviour
        run: npx tsx scripts/tests/w10-isolation.ts
      - name: Alerts & reminders
        run: npx tsx scripts/tests/w5-alerts.ts
      - name: Offline catalog sync & offline sales
        run: |
          npx tsx --tsconfig scripts/tests/w8-harness/tsconfig.json scripts/tests/w6-offline.ts
          npx tsx scripts/tests/w6-barcode-mobile.ts
      - name: Remaining stock writers, kitchen tickets, mobile QR & labels
        run: |
          npx tsx --tsconfig scripts/tests/w8-harness/tsconfig.json scripts/tests/c3-writers.ts
          npx tsx scripts/tests/c3-kot.ts
          npx tsx scripts/tests/c3-mobile-qr.ts
          npx tsx scripts/tests/c3-mobile-labels.ts
      - name: Batches, quarantine, purchasing & document numbering
        run: npx tsx --tsconfig scripts/tests/w8-harness/tsconfig.json scripts/tests/d1-batches-purchasing.ts
      - name: Kitchen tickets & mobile offline fixes
        run: npx tsx --tsconfig scripts/tests/w8-harness/tsconfig.json scripts/tests/d2-kot-mobile.ts
      - name: Platform (hidden defaults, realtime inbox, 100k imports)
        run: npx tsx --tsconfig scripts/tests/w8-harness/tsconfig.json scripts/tests/d3-platform.ts
      - name: Split-payment GL & batches in every sale path
        run: npx tsx --tsconfig scripts/tests/w8-harness/tsconfig.json scripts/tests/e1-final.ts
      - name: Refund to original payment methods
        run: npx tsx --tsconfig scripts/tests/w8-harness/tsconfig.json scripts/tests/f1-refund-original.ts
      - name: Module audits (sales, inventory, purchasing, customers, auth, mobile, automotive)
        env:
          PAYHERE_MERCHANT_ID: '1211111'
          PAYHERE_MERCHANT_SECRET: testsecret
        run: |
          for t in gA-sales gB-inventory gC-purchasing gE-customers-hospitality gF-auth gH-automotive; do
            npx tsx --tsconfig scripts/tests/w8-harness/tsconfig.json scripts/tests/$t.ts
          done
          npx tsx scripts/tests/gG-mobile.ts
      - name: POS cash controls, Sri Lanka VAT, procure-to-pay, pricing & catalog, pharmacy & feature switches
        run: |
          for t in h1-pos-controls h2-tax h3-inventory-purchasing h5-pricing-catalog j1-pharmacy-features k1-cheques-expenses; do
            npx tsx --tsconfig scripts/tests/w8-harness/tsconfig.json scripts/tests/$t.ts
          done
      - name: Branch isolation (staff of one branch cannot see or change another)
        run: npx tsx --tsconfig scripts/tests/w8-harness/tsconfig.json scripts/tests/k4-branches.ts
      - name: Attendance & payroll, hire purchase, document units, recurring/projects, shift collections, labels, measure units
        run: |
          npx tsx scripts/tests/print-size-pricing.ts
          for t in l1-attendance l2-installments l3-document-units l4-recurring-projects l5-loose-ends l6-label-roll l6-label-browser-pdf l11-sticker-setups-save l15-measure-units; do
            npx tsx --tsconfig scripts/tests/w8-harness/tsconfig.json scripts/tests/$t.ts
          done
      - name: Platform (offline sync, backup, API keys, dashboard, read permissions)
        run: npx tsx --tsconfig scripts/tests/h4-harness/tsconfig.json scripts/tests/h4-platform.ts
      - name: Vendor roles & module access, non-functional (timeouts, fan-out, CSRF, retention)
        run: |
          npx tsx --tsconfig scripts/tests/w8-harness/tsconfig.json scripts/tests/i2-roles.ts
          npx tsx --tsconfig scripts/tests/w8-harness/tsconfig.json scripts/tests/i5-nonfunctional.ts
      - name: Super-admin console (vendors, staff, vendor data, vendor stock, platform, roles, coupons, refunds, push)
        env:
          NEXTAUTH_SECRET: i3-test-secret
          PAYHERE_MERCHANT_ID: '1211111'
          PAYHERE_MERCHANT_SECRET: testsecret
        run: |
          npx tsx --tsconfig scripts/tests/i3-harness/tsconfig.json scripts/tests/i3-admin-vendors.ts
          npx tsx --tsconfig scripts/tests/i3-harness/tsconfig.json scripts/tests/i4-admin-platform.ts
          npx tsx --tsconfig scripts/tests/i3-harness/tsconfig.json scripts/tests/i5-vendor-data.ts
          npx tsx --tsconfig scripts/tests/i3-harness/tsconfig.json scripts/tests/k2-recycle-bin.ts
          npx tsx --tsconfig scripts/tests/i3-harness/tsconfig.json scripts/tests/k3-messaging.ts
          npx tsx --tsconfig scripts/tests/i3-harness/tsconfig.json scripts/tests/i6-finish.ts
          npx tsx --tsconfig scripts/tests/i3-harness/tsconfig.json scripts/tests/l9-admin-stock.ts
          npx tsx --tsconfig scripts/tests/i3-harness/tsconfig.json scripts/tests/l14-item-create.ts

  build:
    name: Production build
    runs-on: ubuntu-latest
    needs: [lint-and-validate, typecheck]
    env:
      SKIP_MIGRATIONS: 'true'
      NEXTAUTH_SECRET: ci-build-secret-not-for-production
      NEXTAUTH_URL: http://localhost:3000
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/poslanka
      NEXT_PUBLIC_APP_NAME: POSLanka
      NEXT_PUBLIC_BASE_DOMAIN: localhost
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: retail-smart-erp-main/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

  mobile:
    name: Mobile app typecheck & bundle
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: retail-smart-erp-main/apps/mobile
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: retail-smart-erp-main/apps/mobile/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit -p tsconfig.json

      - name: Android bundle (Metro)
        run: CI=1 npx expo export --platform android --output-dir /tmp/expo-export
